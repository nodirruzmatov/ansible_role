env: development
debug_mode: true
log_dir: /var/log/nginx
access_log: /var/log/dev.log
ssl_certificate: /etc/nginx/ssl/cert.pem
ignore_ip_list:
  - 192.168.1.0/24
  - 127.0.0.0/8
  - 10.0.0.0/24
users:
  - name: John
    role: admin
  - name: Alica
    role: user
  - name: Jack
    role: operator
buyurtmalar:
  - kitob
  - qalam
  - daftar
  - qog'oz
tarmoq_sozlamasi:
  IP: 192.168.0.10
  MASK: 255.255.255.0
  port: 80
  interface: eth0